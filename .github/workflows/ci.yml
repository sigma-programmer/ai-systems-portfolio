name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIKIT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Reproducible benchmarks
        working-directory: projects/p12_architecture_teardown
        run: python -m teardown bench --repeats 2
      - name: Validate ADRs
        working-directory: projects/p12_architecture_teardown
        run: python -m teardown adrs
