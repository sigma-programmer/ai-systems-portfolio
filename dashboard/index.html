<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Systems Portfolio</title>
<!--SNAPSHOT-->
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--panel2:#fbfaf7;--fg:#1c1b19;--muted:#6d6b64;--line:#e3e0d7;
  --accent:#c2410c;--accent-weak:#fdeee6;--ok:#15803d;--ok-weak:#e7f5ec;--bad:#b91c1c;--bad-weak:#fdecec;
  --warn:#a16207;--warn-weak:#fdf6e3;--term:#16161a;--term-fg:#d9d7d0;--chip:#efede7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121211;--panel:#1b1b19;--panel2:#20201d;--fg:#ecebe6;--muted:#a09e96;--line:#2f2e2a;
  --accent:#fb923c;--accent-weak:#3a2416;--ok:#4ade80;--ok-weak:#16291d;--bad:#f87171;--bad-weak:#341818;
  --warn:#facc15;--warn-weak:#332b10;--term:#0c0c0e;--term-fg:#d9d7d0;--chip:#2a2926}}
:root[data-theme=dark]{
  --bg:#121211;--panel:#1b1b19;--panel2:#20201d;--fg:#ecebe6;--muted:#a09e96;--line:#2f2e2a;
  --accent:#fb923c;--accent-weak:#3a2416;--ok:#4ade80;--ok-weak:#16291d;--bad:#f87171;--bad-weak:#341818;
  --warn:#facc15;--warn-weak:#332b10;--term:#0c0c0e;--term-fg:#d9d7d0;--chip:#2a2926}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);font-weight:600}
.badge.live{background:var(--ok-weak);color:var(--ok)}
.badge.snap{background:var(--warn-weak);color:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.layout{flex:1;display:flex;min-height:0}
nav{width:270px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:8px}
nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:13px;cursor:pointer}
nav a:hover{background:var(--panel2)}
nav a.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
nav .num{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px}
nav .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.dot.run{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{flex:1;overflow-y:auto;padding:20px 24px 60px;min-width:0}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:22px;margin:0 0 2px;letter-spacing:-.02em}
.shows{color:var(--muted);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:550;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--accent)}
.pcard .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pcard h4{margin:0;font-size:14px;flex:1}
.pcard .s{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.pcard ul{margin:0;padding:0;list-style:none;font-size:12.5px}
.pcard li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-top:1px dashed var(--line)}
.pcard li span:last-child{font-weight:600;font-family:var(--mono);font-size:12px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.term{background:var(--term);color:var(--term-fg);font:12px/1.5 var(--mono);border-radius:10px;padding:12px 14px;height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .ok{color:#4ade80}.term .bad{color:#f87171}.term .dim{color:#7c7a73}.term .hl{color:#fbbf24}
.runbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
.chip.ok{background:var(--ok-weak);color:var(--ok)}.chip.bad{background:var(--bad-weak);color:var(--bad)}
.chip.warn{background:var(--warn-weak);color:var(--warn)}.chip.acc{background:var(--accent-weak);color:var(--accent)}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ex{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.ex:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hit{padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
.hit b{font-family:var(--mono);font-size:11.5px}
.hit .t{color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0}
.meter>i{display:block;height:100%;background:var(--accent)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--chip);margin:6px 0}
.stack>i{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;font-style:normal;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin:6px 0}
.node{padding:3px 9px;border-radius:6px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.edge{font-family:var(--mono);font-size:11px;color:var(--muted)}
pre.small{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;max-height:340px;overflow:auto;margin:6px 0 0}
.big{font-size:15px;font-weight:600;margin:4px 0}
.muted{color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}
.readme h1{font-size:20px}.readme h2{font-size:17px;margin-top:1.6em}.readme h3{font-size:14.5px}
.readme pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px}
.readme code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
.readme pre code{background:none;padding:0}
.readme table{margin:8px 0}
.err{color:var(--bad);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.empty{color:var(--muted);padding:30px;text-align:center}
@media (max-width:760px){
  .layout{flex-direction:column}
  nav{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:6px}
  nav a{flex-shrink:0}nav .label{max-width:150px}
  main{padding:16px}
  .term{height:340px}
}
</style>
</head>
<body>
<header>
  <h1>AI Systems Portfolio</h1>
  <span id="mode" class="badge">…</span>
  <span id="llm" class="badge"></span>
  <span class="spacer"></span>
  <span id="allstatus" class="muted" style="font-size:12.5px"></span>
  <button class="btn primary" id="runall">Run all tests</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<script>
const SNAP = window.SNAPSHOT || null;
const LIVE = !SNAP;
const state = { projects: [], status: {}, testCounts: {}, current: "overview", tab: null, runs: {}, gwHistory: [] };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = v => typeof v === "number" ? (Number.isInteger(v) ? v.toLocaleString() : (Math.abs(v) < 1e5 ? +v.toPrecision(4) : Math.round(v).toLocaleString())) : (typeof v === "boolean" ? (v ? "yes" : "no") : esc(v));

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }

async function init() {
  $("#mode").textContent = LIVE ? "LIVE · running locally" : "SNAPSHOT · recorded " + SNAP.generated_at;
  $("#mode").className = "badge " + (LIVE ? "live" : "snap");
  const data = LIVE ? await api("/api/projects") : SNAP.projects;
  state.projects = data.projects;
  $("#llm").textContent = data.offline ? "LLM: offline defaults" : "LLM: Claude API";
  if (!LIVE) {
    for (const p of state.projects) {
      const r = SNAP.runs[p.id + ":tests"];
      if (r) { state.status[p.id] = r.code === 0 ? "ok" : "bad"; state.testCounts[p.id] = parseCount(r.lines); }
    }
    $("#runall").textContent = "Replay all tests";
  }
  renderNav();
  route();
  window.addEventListener("hashchange", route);
  updateAllStatus();
}

function parseCount(lines) {
  for (let i = lines.length - 1; i >= 0; i--) { const m = /(\d+) passed/.exec(lines[i]); if (m) return { passed: +m[1], failed: +((/(\d+) failed/.exec(lines[i]) || [0, 0])[1]) }; }
  return null;
}

function renderNav() {
  const items = [`<a data-id="overview" class="${state.current === "overview" ? "active" : ""}"><span class="num">··</span><span class="label">Overview</span></a>`]
    .concat(state.projects.map(p => `<a data-id="${p.id}" class="${state.current === p.id ? "active" : ""}">
      <span class="num">${p.id.slice(1)}</span><span class="label">${esc(p.title)}</span><span class="dot ${state.status[p.id] || ""}"></span></a>`));
  $("#nav").innerHTML = items.join("");
  $("#nav").querySelectorAll("a").forEach(a => a.onclick = () => { location.hash = a.dataset.id === "overview" ? "" : a.dataset.id; });
}

function route() {
  const h = location.hash.slice(1);
  const pid = state.projects.find(p => p.id === h) ? h : "overview";
  if (pid !== state.current) state.tab = null;
  state.current = pid;
  renderNav();
  pid === "overview" ? renderOverview() : renderProject(pid);
  $("main").scrollTop = 0;
}

function updateAllStatus() {
  const vals = Object.values(state.testCounts).filter(Boolean);
  const passed = vals.reduce((a, b) => a + b.passed, 0), failed = vals.reduce((a, b) => a + b.failed, 0);
  const done = Object.keys(state.testCounts).length;
  $("#allstatus").innerHTML = done ? `${done}/${state.projects.length} projects tested · <b style="color:var(--ok)">${passed.toLocaleString()} passed</b>${failed ? ` · <b style="color:var(--bad)">${failed} failed</b>` : ""}` : "";
  if (state.current === "overview") renderSummary();
}

/* ---------------- overview ---------------- */
function renderOverview() {
  $("#view").innerHTML = `
    <h2>Twelve production AI systems, one control panel</h2>
    <p class="shows">${LIVE ? "Everything here executes for real on this machine: demos, test suites, benchmarks and interactive playgrounds." : "A recorded run of every demo, test suite, benchmark and playground. Start the local server to run them live."}</p>
    <div class="summary" id="summary"></div>
    <div class="grid">${state.projects.map(p => `
      <div class="pcard" data-id="${p.id}">
        <div class="top"><span class="chip">${p.id.toUpperCase()}</span><h4>${esc(p.title)}</h4><span class="dot ${state.status[p.id] || ""}"></span></div>
        <p class="s">${esc(p.shows)}</p>
        <ul>${p.headlines.map(([k, v]) => `<li><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("")}</ul>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          ${p.playground ? '<span class="chip acc">playground</span>' : ""}
          ${p.reproducible ? '<span class="chip ok">reproducible bench</span>' : ""}
          ${state.testCounts[p.id] ? `<span class="chip ${state.testCounts[p.id].failed ? "bad" : "ok"}">${state.testCounts[p.id].passed} tests passed</span>` : ""}
        </div>
      </div>`).join("")}</div>`;
  $("#view").querySelectorAll(".pcard").forEach(c => c.onclick = () => location.hash = c.dataset.id);
  renderSummary();
}
function renderSummary() {
  const el = $("#summary"); if (!el) return;
  const vals = Object.values(state.testCounts).filter(Boolean);
  const passed = vals.reduce((a, b) => a + b.passed, 0);
  const tiles = [
    ["Projects", state.projects.length],
    ["Interactive playgrounds", state.projects.filter(p => p.playground).length],
    ["Reproducible benchmarks", state.projects.filter(p => p.reproducible).length + " / 11"],
    ["Tests passed", vals.length ? passed.toLocaleString() + (vals.length < state.projects.length ? ` (${vals.length}/${state.projects.length} run)` : "") : "run them →"],
  ];
  el.innerHTML = tiles.map(([k, v]) => `<div class="stat" style="flex:1;min-width:170px"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
}

/* ---------------- project ---------------- */
function renderProject(pid) {
  const p = state.projects.find(x => x.id === pid);
  const tabs = [...(p.playground ? [["play", "Playground"]] : []), ["demo", "Demo"], ["tests", "Tests"], ["bench", "Benchmark"], ["readme", "README"]];
  state.tab = state.tab || tabs[0][0];
  $("#view").innerHTML = `
    <h2>${esc(p.title)}</h2><p class="shows">${esc(p.shows)} · <span class="muted" style="font-family:var(--mono);font-size:12px">projects/${esc(p.dirname)}</span></p>
    <div class="stats">${p.headlines.map(([k, v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("")}</div>
    <div class="tabs">${tabs.map(([id, l]) => `<button class="tab ${state.tab === id ? "active" : ""}" data-t="${id}">${l}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  $("#view").querySelectorAll(".tab").forEach(t => t.onclick = () => { state.tab = t.dataset.t; renderProject(pid); });
  const body = $("#tabbody");
  if (state.tab === "play") renderPlay(p, body);
  else if (state.tab === "readme") renderReadme(pid, body);
  else renderRun(pid, state.tab, body);
}

async function renderReadme(pid, body) {
  body.innerHTML = '<div class="empty">Loading…</div>';
  const html = LIVE ? (await api("/api/readme?p=" + pid)).html : SNAP.readme[pid];
  body.innerHTML = `<div class="card readme">${html}</div>`;
}

/* ---------------- runs (demo/tests/bench) ---------------- */
const RUN_LABEL = { demo: "Run demo", tests: "Run tests", bench: "Run benchmark" };
const RUN_DESC = {
  demo: "Executes <code>demo.py</code> end-to-end and streams its output.",
  tests: "Runs this project's full pytest suite.",
  bench: "Runs <code>bench.benchmark()</code> in an isolated subprocess (offline, PYTHONHASHSEED=0) and fingerprints the result.",
};
function renderRun(pid, kind, body) {
  const key = pid + ":" + kind;
  body.innerHTML = `
    <div class="runbar"><button class="btn primary" id="go">${LIVE ? RUN_LABEL[kind] : "Replay recorded run"}</button>
      <span id="rstatus"></span><span class="muted" style="font-size:12.5px">${RUN_DESC[kind]}</span></div>
    ${kind === "bench" ? '<div id="benchout"></div>' : ""}
    <div class="term" id="term"><span class="dim">Press “${LIVE ? RUN_LABEL[kind] : "Replay"}” to start.</span></div>`;
  $("#go").onclick = () => startRun(pid, kind);
  const prev = state.runs[key];
  if (prev) paintRun(pid, kind);
}
function colorLine(l) {
  const e = esc(l);
  if (/\b(FAIL|FAILED|ERROR|Traceback|WRONG|error)\b/.test(l)) return `<span class="bad">${e}</span>`;
  if (/\b(passed|OK|ok|PASS|blocked|reproducible)\b|✓/.test(l)) return `<span class="ok">${e}</span>`;
  if (/^(=+|-+|#+|\[)/.test(l.trim())) return `<span class="hl">${e}</span>`;
  return e;
}
function paintRun(pid, kind) {
  const r = state.runs[pid + ":" + kind]; if (!r) return;
  if (state.current !== pid || state.tab !== kind) return;
  const term = $("#term"); if (!term) return;
  const atBottom = term.scrollHeight - term.scrollTop - term.clientHeight < 40;
  term.innerHTML = (r.cmd ? `<span class="dim">$ ${esc(r.cmd)}</span>\n` : "") + r.lines.map(colorLine).join("\n");
  if (atBottom || r.running) term.scrollTop = term.scrollHeight;
  const st = $("#rstatus");
  st.innerHTML = r.running ? '<span class="chip warn">running…</span>'
    : `<span class="chip ${r.code === 0 ? "ok" : "bad"}">${r.code === 0 ? "exit 0 · success" : "exit " + r.code}</span> <span class="muted">${r.seconds ?? ""}s</span>`;
  $("#go").disabled = !!r.running;
  if (kind === "bench" && !r.running) renderBenchTable(r.lines);
}
function startRun(pid, kind, onDone) {
  const key = pid + ":" + kind;
  if (state.runs[key]?.running) return;
  state.runs[key] = { lines: [], running: true };
  if (kind === "tests") { state.status[pid] = "run"; renderNav(); }
  paintRun(pid, kind);
  const finish = (code, seconds) => {
    Object.assign(state.runs[key], { running: false, code, seconds });
    if (kind === "tests") {
      state.status[pid] = code === 0 ? "ok" : "bad";
      state.testCounts[pid] = parseCount(state.runs[key].lines) || { passed: 0, failed: 1 };
      renderNav(); updateAllStatus();
    }
    paintRun(pid, kind); onDone && onDone(code);
  };
  if (!LIVE) {
    const rec = SNAP.runs[key] || { lines: ["(no recording)"], code: 1 };
    let i = 0; const step = Math.max(1, Math.ceil(rec.lines.length / 60));
    const t = setInterval(() => {
      state.runs[key].lines.push(...rec.lines.slice(i, i + step)); i += step; paintRun(pid, kind);
      if (i >= rec.lines.length) { clearInterval(t); finish(rec.code, rec.seconds); }
    }, 25);
    return;
  }
  const es = new EventSource(`/api/run?p=${pid}&kind=${kind}`);
  let pending = false;
  const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; paintRun(pid, kind); }); } };
  es.addEventListener("start", e => { state.runs[key].cmd = JSON.parse(e.data).cmd; schedule(); });
  es.addEventListener("line", e => { state.runs[key].lines.push(JSON.parse(e.data)); schedule(); });
  es.addEventListener("end", e => { es.close(); const d = JSON.parse(e.data); finish(d.code, d.seconds); });
  es.onerror = () => { es.close(); if (state.runs[key].running) { state.runs[key].lines.push("[connection lost]"); finish(1); } };
}
function flatten(o, pre = "", out = {}) {
  if (o && typeof o === "object" && !Array.isArray(o)) { for (const [k, v] of Object.entries(o)) flatten(v, pre + k + ".", out); }
  else if (Array.isArray(o)) { out[pre.slice(0, -1)] = o.every(x => typeof x !== "object") && o.length <= 6 ? o.join(", ") : `[${o.length} items]`; }
  else out[pre.slice(0, -1)] = o;
  return out;
}
function renderBenchTable(lines) {
  const el = $("#benchout"); if (!el) return;
  let data; try { data = JSON.parse(lines.join("\n").slice(lines.join("\n").indexOf("{"))); } catch { el.innerHTML = ""; return; }
  const metrics = data.metrics || data;
  const flat = flatten(metrics);
  el.innerHTML = `<div class="card"><h3>Benchmark result ${data.fingerprint ? `<span class="chip">fingerprint ${esc(data.fingerprint)}</span>` : ""} ${data.wall_s ? `<span class="chip">${data.wall_s}s</span>` : ""}</h3>
    <div class="tablewrap" style="max-height:360px;overflow-y:auto"><table><tbody>${Object.entries(flat).map(([k, v]) => `<tr><td style="font-family:var(--mono);font-size:12px">${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* run all tests */
$("#runall").onclick = async () => {
  const btn = $("#runall"); btn.disabled = true;

/* ---------------- playgrounds ---------------- */
async function play(pid, payload) {
  if (!LIVE) return SNAP.play[pid]?.output || { error: "no recording" };
  return api("/api/play/" + pid, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
}
function exChips(list, onPick) {
  const id = "ex" + Math.random().toString(36).slice(2);
  setTimeout(() => document.querySelectorAll("#" + id + " .ex").forEach((b, i) => b.onclick = () => onPick(list[i])));
  return `<div class="examples" id="${id}"><span class="muted" style="font-size:12px;align-self:center">Try:</span>${list.map(x => `<button class="ex">${esc(typeof x === "string" ? x : x.label)}</button>`).join("")}</div>`;
}
function renderPlay(p, body) {
  const d = SNAP ? (SNAP.play[p.id]?.input || p.play_defaults) : p.play_defaults;
  const note = LIVE ? "" : `<p class="muted" style="font-size:12.5px;margin:0 0 8px">Snapshot mode: showing the recorded result for the default input. Run <code>python dashboard/server.py</code> to try your own inputs.</p>`;
  const F = PLAY[p.id];
  body.innerHTML = `<div class="card">${note}<form id="pf">${F.form(d)}<div style="margin-top:10px"><button class="btn primary" type="submit">Run</button> <span id="pstat" class="muted" style="font-size:12.5px"></span></div></form></div><div id="pout"></div>`;
  const form = $("#pf");
  F.bind && F.bind(form);
  if (!LIVE) form.querySelectorAll("input,textarea,select").forEach(i => i.disabled = true);
  const run = async () => {
    $("#pstat").textContent = "running…";
    const payload = F.read(form);
    try {
      const out = await play(p.id, payload);
      if (out.error) { $("#pout").innerHTML = `<div class="card err">${esc(out.error)}\n${esc(out.traceback || "")}</div>`; $("#pstat").textContent = ""; return; }
      $("#pstat").textContent = out.elapsed_ms != null ? `done in ${out.elapsed_ms} ms (first call builds indexes)` : "";
      $("#pout").innerHTML = F.render(out);
    } catch (e) { $("#pout").innerHTML = `<div class="card err">${esc(e)}</div>`; }
  };
  form.onsubmit = e => { e.preventDefault(); run(); };
  form._run = run;
  run();
}
const val = (f, n) => f.elements[n]?.type === "checkbox" ? f.elements[n].checked : f.elements[n]?.value;
const KCOL = { system: "#64748b", history: "#2563eb", retrieval: "#c2410c", query: "#15803d", memory: "#7c3aed", tools: "#0891b2", tool_results: "#0e7490" };

    form: d => `<p class="muted" style="margin:0 0 6px">Builds a long conversation (a key fact buried a third of the way in) plus 13 documents, then packs it into a small window.</p>

        <span class="chip ${o.fact_kept ? "ok" : "bad"}">buried fact ${o.fact_kept ? "kept" : "lost"}</span></h3>
        <div class="stack">${segs.map(([k, v]) => `<i style="width:${100 * v / lim}%;background:${KCOL[k] || "#888"}">${100 * v / lim > 7 ? k : ""}</i>`).join("")}<i style="width:${100 * r.reserve_output / lim}%;background:repeating-linear-gradient(45deg,#999,#999 4px,#bbb 4px,#bbb 8px)">${100 * r.reserve_output / lim > 9 ? "output" : ""}</i></div>

        <div class="card"><h3>Per-block decisions</h3><div class="tablewrap"><table><thead><tr><th>Block</th><th>Strategy</th><th class="n">Demand</th><th class="n">Allocated</th><th class="n">Used</th><th class="n">Items kept</th><th>Status</th></tr></thead><tbody>
        ${r.blocks.map(b => `<tr><td>${esc(b.name)}${b.required ? ' <span class="chip">required</span>' : ""}</td><td>${esc(b.strategy)}</td><td class="n">${b.demand}</td><td class="n">${b.allocated}</td><td class="n">${b.used}</td><td class="n">${b.items_kept}/${b.items_in}</td><td><span class="chip ${b.status === "full" ? "ok" : "warn"}">${esc(b.status)}</span></td></tr>`).join("")}

        <div class="card"><h3>What the model would see</h3><pre class="small">${esc(o.prompt_preview)}</pre></div>`;
    },
  },
  p02: {
    form: d => `<label class="f">Search query</label><input type="text" name="query" value="${esc(d.query)}">` +
      exChips(["database crash with error code", "is PN92524 in stock", "cannot signin to Kanbroi", "Zephyr Graph crash cache", "remove my data on Theron Care", "how expensive is the telehealth plan"], q => { const f = $("#pf"); f.elements.query.value = q; f._run(); }),

  },
  p03: {

      return `<div class="cols"><div class="card"><h3>GraphRAG ${okG === null ? "" : `<span class="chip ${okG ? "ok" : "bad"}">${okG ? "correct" : "wrong"}</span>`}</h3>

  p07: {

      ${o.hits.map((h, i) => `<tr><td><span class="chip ${i === 0 ? "acc" : ""}">${esc(h.tier)}</span></td><td>${esc(h.text)}</td><td class="n">${h.score}</td><td class="n">${h.similarity}</td><td class="n">${h.importance}</td><td class="n">${h.recency}</td></tr>`).join("")}</tbody></table></div>
      <div class="card"><h3>Distilled profile</h3><table><tbody>${Object.entries(o.profile).map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td><b>${esc(Array.isArray(v) ? v.join("; ") : v)}</b></td></tr>`).join("")}</tbody></table>
